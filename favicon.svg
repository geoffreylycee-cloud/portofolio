<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Dégradé violet moderne et élégant -->
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9c27b0" />
      <stop offset="100%" stop-color="#6a1b9a" />
    </linearGradient>
  </defs>
  
  <!-- Fond squircle moderne violet -->
  <rect width="100" height="100" rx="28" fill="url(#purpleGrad)" />
  
  <!-- Lettre P blanche stylisée et centrée -->
  <text x="50" y="72" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="64" font-weight="800" fill="#ffffff" text-anchor="middle">P</text>
</svg>
